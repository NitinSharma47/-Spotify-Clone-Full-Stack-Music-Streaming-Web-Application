<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign up — Spotify Clone</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="auth-body">
  <div class="auth-card">
    <a href="index.html" class="auth-logo">
      <img src="assets/logo.svg" alt="" width="40" height="40">
      <span>Spotify Clone</span>
    </a>
    <h1>Create your account</h1>

    <div id="authError" class="auth-error"></div>

    <form id="signupForm" class="auth-form">
      <label class="field-label" for="username">Username</label>
      <input type="text" id="username" name="username" class="text-input" placeholder="yourname" required minlength="3" maxlength="50">

      <label class="field-label" for="email">Email</label>
      <input type="email" id="email" name="email" class="text-input" placeholder="you@example.com" required>

      <label class="field-label" for="password">Password</label>
      <input type="password" id="password" name="password" class="text-input" placeholder="At least 6 characters" required minlength="6">

      <button type="submit" class="btn btn-primary btn-full btn-lg">Sign Up</button>
    </form>

    <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    if (isLoggedIn()) window.location.href = 'index.html';
    initAuthForm('signupForm', { endpoint: '/auth/register', redirectTo: 'index.html' });
  </script>
</body>
</html>
